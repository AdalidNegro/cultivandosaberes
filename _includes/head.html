<head>
  <!-- Meta etiquetas básicas -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <meta name="author" content="colsit">

  <!-- Favicon y Touch Icons -->
  <link rel="shortcut icon" href="{{ '/assets/ico/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ '/assets/ico/apple-touch-icon-144-precomposed.png' | relative_url }}">
  <link rel="apple-touch-icon-precomposed" sizes="114x114" href="{{ '/assets/ico/apple-touch-icon-114-precomposed.png' | relative_url }}">
  <link rel="apple-touch-icon-precomposed" sizes="72x72" href="{{ '/assets/ico/apple-touch-icon-72-precomposed.png' | relative_url }}">
  <link rel="apple-touch-icon-precomposed" href="{{ '/assets/ico/apple-touch-icon-57-precomposed.png' | relative_url }}">

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS (CDN Oficial) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- FontAwesome 6 (CDN Oficial) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Animate.css para animaciones nativas -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
